<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // js弱数据类型语言，变量可以不声明类型直接赋值
        let num = 10; // 数字类型
        let str = 'hello'; // 字符串类型
        let str2 =``; // 空字符串
        console.log(str);
        console.log(`str`);//加入``变为字符串样式，不会解析变量
        console.log("huiufiurwh'njsid'");
        console.log('joufhureio"nuiwu"'); 
        console.log('jiwrhiofu\'nujrin\''); // 使用转义字符拼接字符串

// 字符串拼接,数字相加，字符串相连
        console.log('hello' + ' world'); // 使用+号拼接字符串

        let flag = true; // 布尔类型
        let obj = {name: '张三', age: 20}; // 对象类型
        let arr = [1, 2, 3, 4, 5]; // 数组类型
        let und = undefined; // 未定义类型
        let nul = null; // 空值类型
        let sym = Symbol(); // 符号类型
        console.log(typeof num); // number
        // java强数据类型语言 int num = 10; 声明变量必须指定类型，否则编译报错
    </script>
</body>
</html>
