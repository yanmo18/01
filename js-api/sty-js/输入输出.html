<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 文档输出内容
        document.write('我是div标签');
        document.write('<h1>我是h1标签</h1>');
        // 可以直接输出标签
        alert('要出的内容')
        // 控制台打印输出给程序员
        console.log('我是控制台输出');
        // 输入
        prompt('请输入内容')
    </script>
</body>
</html>
