<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 用户输入
        let num = +prompt("请输入一个数字：");
        // 判断输出-小于10才补充0，否则不补充
        num = num < 10 ? '0' + num : num;
        // num = num >=10 ? num : '0' + num;
        // 字符型可以与数字型相加为0num,所以0叫单引号
        alert(num);
    </script>
</body>
</html>
