<body>
    <script>
        let arr = [2, 8, 3, 7, 4];
        for(let i =0; i < arr.length-1; i++){
            // 轮4次，每次比较arr.length-i-1个数。第一趟排序比较4次，第二趟3次，第三趟2次，第四趟1次。

            for(let j = 0; j < arr.length-i-1; j++){
                // 开始交换，但是前提是第一个数大于第二个数
                // 外层循环控制排序趟数，内层循环控制每趟排序中进行的比较次数和数据的交换次数。
                if(arr[j] > arr[j+1]){
                    let temp = arr[j];
                    arr[j] = arr[j+1];
                    arr[j+1] = temp;
        }
    }
        }


        // 开发,排序
        arr.sort(function(a,b){
            return a - b;
            // return a - b; //升序排序a大于b，则a排在前面；反之，b排在前。
            // return b - a; //降序排序

        })

        // num2 = temp;
    </script>
