<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符</title>
</head>
<body>
    <script>
        // 布尔型字面量true和false
        // let flag1 = true;
        // console.log(flag1); // boolean
        console.log(3>4); // boolean
        let isCool = false;
        console.log(isCool); // boolean
// indefined 未定义，null 空值，undefined和null是两个特殊的值
let und;
console.log(und); // undefined,未定义类型，当声明变量未赋值时，默认值是undefined
let nul = null;
console.log(nul); // null,空值类型，表示变量没有值
console.log(undefined+1)//nan
console.log(null+1)//1
    </script>
</body>
</html>
