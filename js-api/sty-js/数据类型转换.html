<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据转换</title>
</head>
<body>
    <script>
        // 隐形转换
        console.log(1 + 123);//124
        console.log(1 + '123');//'124'将后面的转换为与前面相同类型的字符串然后再相加

        console.log('123' + 1);//'1231'
        console.log(2 - 1);//1
        console.log(2 - '1');//1
        console.log('2' - 1);//1
        console.log(+'22' + 1);//23
        console.log('22' - 0);//22
        console.log(typeof 383);//'number'
        console.log(typeof '383');//'string'
        console.log(typeof +'383');//'number'
        // 显性转换
        let num = '123';
        console.log(String(num));//'123'将数字转换为字符串
        console.log(Number('123'));//123将字符串转换为数字
        let num1 =Number(prompt('请输入数字'));//prompt输入的内容是字符串类型
        let num2 =+prompt('请输入数字');//将字符串转换为数字,使用隐型转换
        //parseInt() parseFloat()
        console.log(parseInt('12.34abc'));//12只转换整数部分，遇到非数字停止转换
        console.log(parseFloat('12.34abc'));//12.34只转换数字部分，遇到非数字停止转换
    </script>
</body>
</html>
