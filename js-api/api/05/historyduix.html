<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>后退</button><button>前进 </button>

    <script>  
const btnBack = document.querySelector('button:first-child');
const btnForward = btnBack.nextElementSibling
btnBack.addEventListener('click', function() {
    history.back();
    history.go(-1);
})
btnForward.addEventListener('click', function() {
    history.forward()
    history.go(1);
})

    </script>
</body>
</html>
