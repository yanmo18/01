<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>学生就业统计表</title>
  <link rel="stylesheet" href="./iconfont/iconfont.css">
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <h1>学生就业统计表</h1>
  <form class="info" autocomplete="off">
    <input type="text" class="uname" name="uname" placeholder="姓名" />
    <input type="text" class="age" name="age" placeholder="年龄" />
    <input type="text" class="salary" name="salary" placeholder="薪资" />
    <select name="gender" class="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    <select name="city" class="city">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
      <option value="深圳">深圳</option>
      <option value="曹县">曹县</option>
    </select>
    <button class="add">
      <i class="iconfont icon-tianjia"></i>添加
    </button>
  </form>

  <div class="title">共有数据<span>0</span>条</div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>薪资</th>
        <th>就业城市</th>
        <th>录入时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- <tr>
        <td>1</td>
        <td>迪丽热巴</td>
        <td>23</td>
        <td>女</td>
        <td>12000</td>
        <td>北京</td>
        <td>2099/9/9 08:08:08</td>
        <td>
          <a href="javascript:">
            <i class="iconfont icon-shanchu"></i>
            删除
          </a>
        </td>
      </tr> -->
    </tbody>
  </table>
  <script>
    // 参考数据
    const initData = [
      {
       stuId: 1,
        uname: '迪丽热巴',
        age: 22,
        salary: '12000',
        gender: '女',
        city: '北京',
        time: '2099/9/9 08:08:08'
      }
    ]
     // localStorage.setItem用于将数据存储为本地存储，运行一次就可以，后会发现新数据被存储到了本地
      localStorage.setItem('stuData', JSON.stringify(initData))
      // 1.渲染业务
      // 1.1先读取本地数据
      // a.本地存储有数据则将其解析为对象，存储到变量中，
      // b.如果没有则使用空数组，后期用于渲染表格，
      const arr=JSON.parse(localStorage.getItem('data')) || []
      const tbody = document.querySelector('tbody')
        // console.log(arr);
        // 1.利用map和join拼接字符串，渲染表格
        // 渲染模块封装为一个函数，传入数据源数组
      function render(){
          // 1.1利用map遍历数组，返回对应的tr数组
        const trArr=arr.map(function(items,index){
            return `
            <tr>
          <td>${items.stuId}</td>
          <td>${items.uname}</td>
          <td>${items.age}</td>
          <td>${items.gender}</td>
          <td>${items.salary}</td>
          <td>${items.city}</td>
          <td>${items.time}</td>
          <td>
            <a href="javascript:" data-id=${index}>删除</a>
          </td>
        </tr> `
          })
          console.log(trArr);
          // 1.2利用join方法，将数组元素拼接成一个字符串，插入到表格中
         tbody.innerHTML=trArr.join('')
          // 1.3将生成的tr字符串，插入到表格中tbody里,使用innerHTML
          // 统计一共有多少数据
          document.querySelector('.title span').innerHTML=arr.length
        }
        render()
    
//  2.新增学员的业务
// 2.1阻止默认事件
const info=document.querySelector('.info')
const uname=document.querySelector('.uname')
const age=document.querySelector('.age')
const salary=document.querySelector('.salary')
const gender=document.querySelector('.gender')
const city=document.querySelector('.city')
info.addEventListener('submit',function(e){
  e.preventDefault()
// 2.2非空判断
if(!uname.value||!age.value||!salary.value){
  return alert(`输入不能为空`)
}
// 2.3给数组arr追加对象里面存储表单获取过来的数据
arr.push({
  // stuId:arr.length+1,
  // 使用新增加序号应该是最后一条数据的序号+1，但是现在写法有问题，应该先写好再增加，stuId+1
  stuId:arr.length>0?arr[arr.length - 1].stuId + 1:1,
  uname:uname.value,
  age:age.value,
  salary:salary.value,
  gender:gender.value,
  city:city.value,
  time:new Date().toLocaleString()
})
render() 
this.reset()// 重置表单
// 2.4将arr数组存储到本地,使用localStorage
localStorage.setItem('data',JSON.stringify(arr))
})

  //  删除业务
  // 使用事件委托冒泡给tbody绑定事件
  tbody.addEventListener('click',function(e){
    // 判断点击的目标元素是否是a标签
    if(e.target.tagName ==='A'){
      // alert('你点击了删除')
      // console.log(e.target.dataset.id);
      if(confirm('你确定要删除吗？')){
      arr.splice(e.target.dataset.id,1)
      // 重新渲染数据
      render()
      // 重新存储本地数据
      localStorage.setItem('data',JSON.stringify(arr))
      }
    }
  })

  </script>
</body>

</html>
