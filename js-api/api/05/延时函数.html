<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            position: fixed;
            left: 0;
            bottom: 0;
       
        }
    </style>
</head>
<body>
    <img src="./ad.png" alt="">
    <script>
        const ad = document.querySelector('img');
        setTimeout(function(){
            ad.addEventListener('click',function(){
                ad.style.display = 'none'
        })
        },5000)
    </script>
</body>
</html>
