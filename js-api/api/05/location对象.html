<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <input type="text" name="1" id="">

        <input type="text" name="2" id="">
        <input type="text" name="3" id="">
        <button class="reload">提交</button>
        <a href="#123/">123</a>
        <a href="#456/">456</a>
        <a href="#789/">789</a>
    </form>
    <script>
         // hash 参数 #xxx
        console.log(location.hash);
        console.log(window.location);
        console.log(location);
        console.log(location.href);
        // 1.经常用href，利用js方法改变href的值，可以实现页面的跳转
        //2. location.href = 'https://www.baidu.com';
        //3. search 参数
        console.log(location.search);
        // 方法reload()可以实现页面的重新加载
        const reload = document.querySelector('.reload');
        reload.addEventListener('click', function () {
        location.reload();
        // 刷新强制ctrl+F5刷新页面，强制清除缓存
        location.reload(true);
        })
       
    </script>
</body>
</html>
