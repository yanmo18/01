<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tab栏切换</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .tab {
      width: 590px;
      height: 340px;
      margin: 20px;
      border: 1px solid #e4e4e4;
    }

    .tab-nav {
      width: 100%;
      height: 60px;
      line-height: 60px;
      display: flex;
      justify-content: space-between;
    }

    .tab-nav h3 {
      font-size: 24px;
      font-weight: normal;
      margin-left: 20px;
    }

    .tab-nav ul {
      list-style: none;
      display: flex;
      justify-content: flex-end;
    }

    .tab-nav ul li {
      margin: 0 20px;
      font-size: 14px;
    }

    .tab-nav ul li a {
      text-decoration: none;
      border-bottom: 2px solid transparent;
      color: #333;
    }

    .tab-nav ul li a.active {
      border-color: #e1251b;
      color: #e1251b;
    }

    .tab-content {
      padding: 0 16px;
    }

    .tab-content .item {
      display: none;
    }

    .tab-content .item.active {
      display: block;
    }
  </style>
</head>

<body>
  <div class="tab">
    <div class="tab-nav">
      <h3>每日特价</h3>
      <ul>
        <li><a class="active" href="javascript:;" data-id="1">精选</a></li>
        <li><a href="javascript:;"data-id="2">美食</a></li>
        <li><a href="javascript:;"data-id="3">百货</a></li>
        <li><a href="javascript:;"data-id="4">个护</a></li>
        <li><a href="javascript:;"data-id="5">预告</a></li>
      </ul>
    </div>
    <div class="tab-content">
      <div class="item active"><img src="../02-imgs/tab00.png" alt="" /></div>
      <div class="item"><img src="../02-imgs/tab01.png" alt="" /></div>
      <div class="item"><img src="../02-imgs/tab02.png" alt="" /></div>
      <div class="item"><img src="../02-imgs/tab03.png" alt="" /></div>
      <div class="item"><img src="../02-imgs/tab04.png" alt="" /></div>
    </div>
  </div>
<script>
  // 采取事件委托形式
  // 获取ul元素，父元素
  const ul=document.querySelector('.tab-nav ul')
  ul.addEventListener('click',function(e){
    // alert(e.target)
    //只有点击a才会执行添加类删除类
    if(e.target.tagName==='A'){
      //删除a类名active
      document.querySelector('.tab-nav a.active')
      .classList.remove('active')
      e.target.classList.add('active')
      // 自定义属性，获取数据
      // alert(e.target.dataset.id)
      const id=e.target.dataset.id
      // 删除item类名active
      document.querySelector('.tab-content .item.active').classList.remove('active')
      document.querySelector(`.tab-content .item:nth-child(${id})`).classList.add('active')
    }
  })
</script>
</body>

</html>
