<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box" id="root">hellow</div>
    <script>
        var root=document.getElementById('root');//通过id获取元素，返回单个元素对象
        root.id="roots";//修改id属性
        root.className="boxs box2";//修改class属性
        console.log(root.classList.add(
            "box3",
        ));//获取元素的类名列表，返回一个类数组对象
        console.log(root.classList.remove("box2"));//删除指定的类名
        console.log(root.classList.toggle("box3"));//切换类名，有则删除，没有则添加
        if(root.classList.contains("box")){
            console.log("包含box类名");
        }else{
            console.log("不包含box类名");
        }
        console.log(root.classList.contains("box"));//检查是否包含指定的类名，返回布尔值
        console.log(root.id);//获取id属性值
        console.log(root.innerHTML);//获取元素的HTML内容
        console.log(root.outerHTML);//获取元素的HTML内容，包括元素本身
        console.log(root.innerHTML="大家好");//修改元素的HTML内容
        console.log(root.innerText);//获取元素的文本内容
        console.log(root.outerText);//获取元素的文本内容，包括元素本身
        console.log(root.innerText="欢迎大家");//修改元素的文本内容
        //innerHTML可以解析html标签，innerText只能解析文本内容
        var str="<a href='#'>链接</a>";
        root.innerHTML=str;//可以解析html标签
        //root.innerText=str;//只能解析文本内容
  </script>
</body>
</html>
