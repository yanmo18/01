<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        hello world
    </div>
    <div class="nav">1</div>
    <div class="nav">2</div>
    <div class="box"></div>
    <div class="frist"></div>
    <p class="text">导航栏</p>
    <form name="loginForm">
        <input type="text" />
        <input type="password" />
    </form>
    <script>
        var divs=document.getElementsByTagName('div');//搜索html标签名，获取所有div元素，返回的是一个伪数组，传入星号*表示获取所有元素
        console.log(divs[0]);//获取第一个div元素对象
        var divs2=document.getElementsByClassName('box frist');//通过类名获取元素，返回伪数组,由于class是关键字，所以用className，表示css的类名，可以传入多个类名，之间用空格隔开
        console.log(divs2[0]);//获取第一个类名为box的元素对象
        var ps=document.getElementsByName('loginForm');//通过类名获取元素，返回伪数组
        var p=document.getElementById('nav');//通过id获取元素，返回单个元素对象
        console.log(p);
        var img=document.querySelector('div.box');//通过css选择器获取第一个匹配的元素，返回单个元素对象
        console.log(img);
        var imgs=document.querySelectorAll('#nav');//通过css选择器获取所有匹配的元素，返回伪数组,加入#表示id，.表示类名

















        </script>
</body>
</html>
