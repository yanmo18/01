<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //setInterval（函数，间隔时间），每隔一段时间调用这个函数，1000毫秒=1秒
        setInterval(function(){
            console.log('一秒一次')
        },1000)
        function sa(){
            console.log('一秒一次2')
        }
        setInterval(sa,1000)//只穿函数，名不加括号，因为加了括号会立即执行，不加括号是每隔一秒执行一次函数
        //setInterval('sa()',1000)//也可以传字符串，但是不推荐使用字符串，推荐使用函数名')


        //定时器关闭
        let saa = setInterval(sa,1000)
        //关闭定时器
        clearInterval(saa)
        //重新开启定时器
        saa = setInterval(sa,1000)
        

        //函数调用可视化
        let i=0
        setInterval(function(){
            i++
            document.write(`${i}`)
        },100)
    </script>
</body>
</html>
