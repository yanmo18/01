<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <script>
    // 1.getTime()必须实例化Date对象使用
    const date=new Date()
    console.log(date.getTime())
    // +new Date() 相当于 new Date().getTime()
    console.log(+new Date())//+将new Date()转为数字类型，等同于getTime()
    // 3.Date.now()是可以直接使用，不需要实例化对象D
    console.log(Date.now())
    // 获取特定时间戳

    console.log(+new Date('2023-10-15 12:00:00'))
    console.log(date.getTime('2023-10-15 12:00:00'))
    </script>  
</body>
</html>
