<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 div {
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div></div>
    <script>
        const div=document.querySelector('div');
        const date=new Date();
        div.innerHTML=date.toLocaleString();
        // 2022/10/19 10:32:20格式
        setInterval(()=>{
            div.innerHTML=date.toLocaleString();
        },1000) 
        div.innerHTML=date.toLocaleDateString();// 2022/10/19格式
        div.innerHTML=date.toLocaleTimeString();// 10:32:20格式
    </script>
</body>
</html>
