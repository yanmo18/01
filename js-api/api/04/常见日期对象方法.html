<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 获取日期对象
        const date=new Date()
        // 常用方法
        console.log(date.getFullYear())//获取四位年份2026
        console.log(date.getMonth()+1)//获取月份，0-11，要加一
        console.log(date.getDate())//获取日，1-31
        console.log(date.getDay())//获取星期几，0-6，0为周日，6为周六
        console.log(date.gatHours())//获取小时0-23
        console.log(date.getMinutes())//获取分钟0-59
        console.log(date.getSeconds())//获取秒0-59
        // 页面显示时间2000-01-01 00-00-00
        
            </script>
</body>
</html>
