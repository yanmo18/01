<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
     * {
         margin: 0;
         padding: 0;
     }
     h2 {
         text-align: center;
     }
     .box {
         width: 600px;
         margin: 50px auto;
         display: flex;
         font-size: 25px;
         line-height: 40px;
     }
     .qs {

         width: 450px;
         height: 40px;
         color: red;
     }
     .btns {
         text-align: center;
     }
     .btns button {
         width: 120px;
         height: 35px;
         margin: 0 50px;
     }
 </style>
</head>
<body>
    <h2>随机点名</h2>
<div class="box">
    <span>名字是：</span>
    <div class="qs">这里显示姓名</div>
</div>
<div class="btns">
    <button class="start">开始</button>
    <button class="end">结束</button>
</div>

<script>
    // 数据数组
    const arr = ['马超', '黄忠', '赵云', '关羽', '张飞']
    let timer=0
    //随机号要全局变量
    let random=0
    //1开始按钮模块
    const qs=document.querySelector('.qs')
     //随机数存放地方获取
    //1.1获取开始按钮对象
    const start=document.querySelector('.start')
    //1.2添加点击事件
    start.addEventListener('click',function(){
        timer=setInterval(function(){
         //随机数
        const random = parseInt(Math.random() * arr.length)
        qs.innerHTML=arr[random]
    },35)

    //如果数组里面只有一个元素，按钮禁用
    if(arr.length==1){
        start.disabled=true
        end.disabled=true//使用style控制css样式
    }
    })
   
    //1结束按钮模块
    const end=document.querySelector('.end')
    end.addEventListener('click',function(){
        clearInterval(timer)
    })
    //添加结束事件监控，让事件的处理程序是清除定时器，清除定时器必须有定时器编号，可以给定时器赋值，定时器编号赋值给变量timer
    //结束后删除当前抽取的元素，随机号要全局变量，随机数抽取后删除当前元素
    arr.splice(random,1)
    //splice(随机号，1)删除当前元素
    console.log(arr)
    </script>
    </body>
</html>
