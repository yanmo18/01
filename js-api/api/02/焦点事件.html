<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text">
    <script>
        const input=document.querySelector('input')
        input.addEventListener('focus',function(){
            alert('输入框获得焦点了')
        })
        input.addEventListener('blur',function(){
            alert('输入框失去焦点了')
        })
    </script>
</body>
</html>
