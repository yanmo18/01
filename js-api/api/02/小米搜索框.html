<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ul {

            list-style: none;
        }

        .mi {
            position: relative;
            width: 223px;
            margin: 100px auto;
        }

        .mi input {
            width: 223px;
            height: 48px;
            padding: 0 10px;
            font-size: 14px;
            line-height: 48px;
            border: 1px solid #e0e0e0;
            outline: none;
        }

        .mi .kuang {
            border: 1px solid #ff6700;
        }

        .result-list {
            display: none;
            /* 隐藏掉搜索框 */
            position: absolute;
            left: 0;
            top: 48px;
            width: 223px;
            border: 1px solid #ff6700;
            border-top: 0;
            background: #fff;
        }

        .result-list a {
            display: block;
            padding: 6px 15px;
            font-size: 12px;
            color: #424242;
            text-decoration: none;
        }

        .result-list a:hover {
            background-color: #eee;
        }
    </style>

</head>

<body>
    <div class="mi">
        <input type="search" placeholder="小米笔记本">
        <ul class="result-list">
            <li><a href="#">全部商品</a></li>
            <li><a href="#">小米11</a></li>
            <li><a href="#">小米10S</a></li>
            <li><a href="#">小米笔记本</a></li>
            <li><a href="#">小米手机</a></li>
            <li><a href="#">黑鲨4</a></li>
            <li><a href="#">空调</a></li>
        </ul>
    </div>
    <script>
        // 1. 获取输入框元素
        // const input=document.querySelector('[type=search]'),这是使用属性选择器获取元素
        const input =document.querySelector('.mi input')
        const lis=document.querySelector('.result-list')
        //监听事件，焦点
        input.addEventListener('focus',function(){
            lis.style.display='block'
            //显示搜索框
            input.classList.add('kuang')
            //添加类名，直接改变边框颜色，有css样式
        })
        //失去焦点
        input.addEventListener('blur',function(){
            lis.style.display='none'
            //关闭搜索框
            input.classList.remove('kuang')
            //移出类名，直接改变边框颜色，有css样式
        })
    </script>
</body>

</html>
