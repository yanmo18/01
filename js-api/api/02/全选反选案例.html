<!DOCTYPE html>

<html>

<head lang="en">
  <meta charset="UTF-8">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    table {
      border-collapse: collapse;
      border-spacing: 0;
      border: 1px solid #c0c0c0;
      width: 500px;
      margin: 100px auto;
      text-align: center;
    }

    th {
      background-color: #09c;
      font: bold 16px "微软雅黑";
      color: #fff;
      height: 24px;
    }

    td {
      border: 1px solid #d0d0d0;
      color: #404060;
      padding: 10px;
    }

    .allCheck {
      width: 80px;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <th class="allCheck">
        <input type="checkbox" name="" id="checkAll"> <span class="all">全选</span>
      </th>
      <th>商品</th>
      <th>商家</th>
      <th>价格</th>
    </tr>
    <tr>
      <td>
        <input type="checkbox" name="check" class="ck">
      </td>
      <td>小米手机</td>
      <td>小米</td>
      <td>￥1999</td>
    </tr>
    <tr>
      <td>
        <input type="checkbox" name="check" class="ck">
      </td>
      <td>小米净水器</td>
      <td>小米</td>
      <td>￥4999</td>
    </tr>
    <tr>
      <td>
        <input type="checkbox" name="check" class="ck">
      </td>
      <td>小米电视</td>
      <td>小米</td>
      <td>￥5999</td>
    </tr>
  </table>
  <script>
    //获取大复选框
    const checkAll=document.querySelector('#checkAll')
    //获取所有小复选框
    const checks=document.querySelectorAll('.ck')
    // 点击大复选框，所有复选框变化，添加事件
    checkAll.addEventListener('click',function(){
      // console.log(this.checked)//生成布尔值，true或false
      // 遍历小复选框，改变状态小复选框和大复选框checked值一致，布尔值
      for(let i=0;i< checks.length;i++){
        // checks[i].checked =true
        // checks[i].checked=checkAll.checked
        checks[i].checked = this.checked
      }

    })

    //小复选框控制大复选框
    // 给所有小复选框添加点击事件
    for(let i=0;i<checks.length;i++){
    checks[i].addEventListener('click',function(){
      //判断选择的小复选框个数是否等于总个数
      // console.log(document.querySelectorAll('.ck:checked').length===checks.length)
      // ===是判断类型的，生成值为布尔值，true或false
      checkAll.checked=document.querySelectorAll('.ck:checked').length === checks.length
      // checkAll.checked的值取是布尔值。刚好===checks.length的值也是布尔值，所以可以直接赋值给checkAll.checked
    })
  }
  </script>
</body>

</html>
