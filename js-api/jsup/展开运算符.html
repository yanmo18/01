<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const arr=[1,2,3,4,5]
        console.log(...arr)//展开运算符可以将数组展开成一个个独立的值，适用于函数调用和数组字面量中
        // 获取数组最大值最小值
         console.log(Math.max(1,2,3,4,5))
        console.log(Math.max(...arr))//输出5
        console.log(Math.min(...arr))//输出1

        // 合并数组
        const arr1=[1,2,3]
        const arr2=[4,5,6]
        console.log([...arr1,...arr2])//输出[1,2,3,4,5,6]

        // 拷贝数组
        const arr3=[1,2,3]
        const arr4=[...arr3]
        console.log(arr4)//输出[1,2,3]

        // 浅拷贝对象

    </script>
</body>
</html>
