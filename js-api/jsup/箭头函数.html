<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button></button>
    <script>
        //写法基础
        const fn=function(){
            console.log(123)
        }
        //箭头函数
        const fn1=()=>{
            console.log(123)
        }
        fn1()//输出123
        // 当函数的参数只有一个时，可以省略小括号
        const fn2=(x)=>{
            console.log(x)
        }
        fn2(123)//输出123
        const fn3=x=>{
            console.log(x)
        }

        // 只有一行代码时，可以省略大括号和return关键字
        const fn4=x=>{
            console.log(x)
        fn4(123)//输出123
        }
        const fn5=x=>console.log(x)
        fn5(123)//输出123
        // 省略return
        const fn6=x=>{
            return x+1
        }
        console.log(fn6(2))//输出3

        const fn7=x=>x+1
        console.log(fn7(2))//输出3

        // 箭头函数可以直接返回一个对象字面量，但需要将对象字面量包裹在圆括号中，以避免与函数体的花括号混淆。
        const fnn=(uname)=>({uname:uname})
       console.log(fnn('张三'))


    //    1.利用箭头函数来求和
    const getSum=(...arr)=>{
        let sum=0
        for(let i=0;i<arr.length;i++){
            sum=arr[i]+sum
        }
        return sum
    }
    const result=getSum(1,3,5)//接收参数，并且定义一个变量来接收返回值
    console.log(result)//输出9


    // 箭头函数的this指向
    // this会指向调用它的对象，没有就是window
    console.log(this)//输出window
    // 普通函数
    function ths(){
        console.log(this)//输出window
    }
    ths()//实际是window.ths(),所以this指向window
    const obj={
        name:'张三',//对象属性
        sayHi:function(){//对象方法
            console.log(this)
        }
    }
    obj.sayHi()//输出obj对象，因为sayHi是obj的方法，所以this指向obj 

    // 箭头函数的this，是上一层作用域的this 
    const obj1=()=>{
        console.log(this)//输出window，因为箭头函数没有自己的this，所以this指向外层作用域的this，即window
    }
    obj1()
    // 对象方法箭头函数this
    const obj2={
        name:'张三',
        sayHi:()=>{
            console.log(this)//输出windeow,箭头函数没有this，向上寻找作用域this，window
        }
    }
    obj2.sayHi()
    // 嵌套函数this
    const obj3={
         name:'张三',
         sayHi:function(){
            console.log(this)//输出obj3，因为是obj3 进行调用的
            let i=10
            const innerFn=()=>{
                console.log(this)//输出obj3，向上寻找到上一层作用域this，作用域链 
            }
    }
}

// 箭头函数DOM节点
const but=document.querySelector('button')
// 
    </script>
</body>
</html>
