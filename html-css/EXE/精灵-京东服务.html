<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东服务</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li{
            list-style: none;
        }
        .service{
            margin: 100px auto;
            width:1190px;
            height: 42px;
            /* background-color: azure; */
        }
        .service ul{
            display: flex;
        }
        .service li{
            display: flex;
            width: 297px;
            height: 42px;
            padding-left: 40px;
        }
        .service li h5{
            margin-right: 10px;
            width: 36px;
            height: 42px;
            /* background-color: aqua; */
            background: url(./img/sprite.png) 0 -192px;
        }
        .service ul li:nth-child(2) h5{
            background: url(./img/sprite.png) -40px -192px;
        }
        .service ul li:nth-child(3) h5{
            background: url(./img/sprite.png) -80px -192px;
        }
        .service ul li:nth-child(4) h5{
            background: url(./img/sprite.png) -120px -192px;
        }
        .service li p{
            font-size: 18px;
            color: #666;
            line-height: 42px;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="service">
    <ul>
        <li>
            <h5></h5>
            <p>免费安装</p>
        </li>
        <li>
            <h5></h5>
            <p>服务2描述</p>
        </li>
        <li>
            <h5></h5>
            <p>服务3描述</p>
        </li>
        <li>
            <h5></h5>
            <p>服务4描述</p>
        </li>
    </ul>
</div>
</body>
</html>
