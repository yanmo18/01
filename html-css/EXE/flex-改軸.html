<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex修改軸方向</title>
    <style>
        .box{
            display: flex;
            /* 修改主轴方向，到垂直，侧轴会自动变换到水平方向 */
            /* flex-direction: column; */
            justify-content: center;
            align-items: center;
            width: 150px;
            height: 120px;
            background-color: aqua;
        }
        img{
            width: 32px;
            height: 32px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="" alt="">
<span>媒体</span>
    </div>
    
</body>
</html>
