<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定定位</title>
    <!-- 元素位置在网页滚动时位置不动 -->
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .fixed {
            position: fixed; /* 固定定位 */
            top: 0;
            left: 0;
            bottom: 0;
            margin: auto;
        }
        /* 固定定位
        1.脱标，不占位
        2.相对于视口定位
        3.标签显示模式特点，变为行内块，宽高生效
        */
    </style>
</head>
<body>
    
</body>
</html>
