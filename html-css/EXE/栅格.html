<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栅格系统</title>
<link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body>
    <!-- 视口宽度大于等于1200px，一行4个盒子,占3份宽度，即一行4个盒子占12份宽度

        视口宽度大于等于992px，一行3个盒子
        视口宽度大于等于768px，一行2个盒子
        视口宽度小于768px，一行1个盒子
    -->
        <!-- 版心>row>子级 -->
            <div class="container">
                <div class="row">
                    <div class="col-xl-3  col-md-6 col-sm-12"></div>
                    <!-- col-xl-12 -->
                    <div class="col-xs-12  col-md-6 col-sm-12"></div>
                    <div class="col-xs-12  col-md-6 col-sm-12"></div>
                    <div class="col-xs-12  col-md-6 col-sm-12"></div>
                </div>
            </div>
</body>
</html>
