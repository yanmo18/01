<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体图标</title>
    <!-- 可以用于制作网页中的小图标 ，展示的是图标，本质是字体，
     在网页中添加简单的，颜色单一的小图标-->
    <style>
        /* 1.引入字体文件 */
        @font-face {
            font-family: 'iconfont';  /* 自定义的字体名称 */
            src: url(./font/iconfont.ttf) format('truetype'); /* 字体文件路径 */
        }
        /* 2.使用字体图标 */
        .icon{
            font-family: 'iconfont'; /* 使用自定义的字体 */
            font-size: 50px; /* 设置字体大小 */
            color: orange; /* 设置字体颜色 */
        }
        </style>
</head>
<body>
    <!-- 可以在这里添加图标 -->
</body>
</html>
