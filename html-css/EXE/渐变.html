<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐变</title>
    <style>
        .div{
            width: 200px;
            height: 200px;
            background-color:blue;
            background-image: linear-gradient(
                to right,
                 red , 
                 yellow);
                /* 颜色间使用逗号，最后一个不加 */
    
          background-image: linear-gradient(
                45deg,
                 red 80% ,
                  /*颜色终点位置，80%处  */
                 yellow);
        }
        /* transparent透明颜色 */

    </style>
</head>
<body>
    <div class="div"></div>
</body>
</html>
</body>
</html>
