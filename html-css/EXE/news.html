<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻列表</title>
</head>
<style>
/* 先去除默认样式，列表默认样式，《ul>点，内外边距，超链接的下划线 */
/* 无序列表<ul> */
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;/*内剪，boder加了padding不会撑大盒子*/
}
li{
    list-style: none;
}
a{
    text-decoration: none;
}
.news{
    margin: 100px auto;/*外边距*/
    height: 200px;
    width: 360px;
}
.news .hd{
    height: 34px;
    background-color: #eee;
    border: 1px solid #dbdee1;
    border-left: none;
}
.news .hd a{
    /* -1盒子向上移动 */
    margin-top: -1px;   
    width: 48px;
    height: 34px;
    background-color: #fff;
    display: block;
    border-top: 3px solid #ff8400;
    border-right: 1px solid #dbdee1;
    /* 将行内元素转化为块状元素 */
    text-align: center;
    line-height: 32px;
    /* 行高 ：文本之间的垂直距离*/
    font-size: 14px;
    color: #333;
}
.news .hd{
    padding: 5px;
}
.news .bd li{
    padding-left: 15px;
    background-image: url(C:\Users\LENOVO\Pictures\profile.jpg);/*单一属性不能设置属性*/
    background-position: 0 center;
    background-repeat: no-repeat;
}
.news .bd li a{
    padding-left: 20px;
    background: url(C:\Users\LENOVO\Pictures\profile.jpg) no-repeat 0 center;/*复合属性属性*/
    font-size: 12px;
    color: #333;
    line-height: 24px;
}
.news .bd li a:hover{
    color: #ff8400;
}
</style>
<body>
    <!-- x新闻区域，包含标题+内容 -->
<div class="news">
 <div class="hd"><!-- 默认宽度为父级100%  -->
    <a href="#">新闻</a>
    </div>
    <div class="bd">
<ul>
    <li><a href="#">byuibgjhbfsdjkfbuydasvbhyf</a></li>
        <li><a href="#">byuibgjhbfsdjkfbuydasvbhyf</a></li>
            <li><a href="#">byuibgjhbfsdjkfbuydasvbhyf</a></li>
                <li><a href="#">byuibgjhbfsdjkfbuydasvbhyf</a></li>
                    <li><a href="#">byuibgjhbfsdjkfbuydasvbhyf</a></li>
</ul>
    </div>
    <!-- 超链接行内元素，加宽高不生效，使用display进行转化 -->
</div>
</body>
</html>
