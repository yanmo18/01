<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体图标使用</title>
    <link rel="stylesheet" href="../01/iconfont/iconfont.css">
    <style>
        /* 如果要调整 字体大小，注意选择器优先级，要高于iconfont（类选择器） ,使用类选择器，
        如果使用span标签，则不生效*/

            font-size: 200px;
            color: rgb(115, 174, 230);
        }
        </style>
</head>
<body>
    <span class="iconfont icon-ic-button-generate"></span>
</body>
</html>
