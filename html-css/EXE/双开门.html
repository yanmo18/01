<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双开门平面转换</title>
    <style>
*{
    margin: 0;
    padding: 0; 
}
/*1.布局：父子结构，父级为大图，子级为左右小图 */
/* 2.鼠标悬停效果，左右移动 */
.father{
    display:flex;
    width: 1366px;
    height: 600px;
    margin: 0 auto;
    background-image:url(./img/bg.jpg);
       overflow: hidden;
}
.father .left,.father .right{
    width: 50%;
    height: 600px;
    background-image:url(./img/fm.jpg);
    transition:all 0.5s;
 
    /* 超过的全部隐藏，不可见 */
}
.father .right{
    /* right表示取到精灵图右侧图片 */
    background-position:right 0;
}
.father:hover .left{
    transform:translateX(-100%);
}
.father:hover .right{
    transform:translateX(100%);
}
</style>
</head>

<body>
    <div class="father">
        <div class="left"></div>
        <div class="right"></div>
    </div>
    
</body>
</html>
