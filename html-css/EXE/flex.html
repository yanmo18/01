<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-</title>
<!-- 给父级设置display：flex，子级可以自己挤压拉伸，弹性容器，弹性盒子，主轴默认在水平方向，侧轴与交叉軸默认垂直 -->
<style>
    .box{
        display: flex;
        /* 弹性盒子在侧轴方向无法拉伸，主轴可以stretch */
        /* align-items:stretch */
        /* justity-content;justity-start */
        /* justity-content:flex-end */
        /* 居中 */
        /* justity-content:space-between */
        /* 父级剩余尺寸分配位间距，弹性盒子间距相同 */
        /* justify-content: space-around; */
        /* 会将空白间距分配到两侧 ，视觉效果，盒子两边间距是两段2被*/
/* justify-content: space-evenly; */
/* 各个间距相同 */

/* 侧轴对齐方式 */
/* align-items: flex-start;从起点开始排列 */
/* align-items: flex-end; */
        height: 300px;
        border: 1px solid #000;
    }
    /* 控制第二个div,侧轴居中对齐，先找到盒子 */
/* .box div:nth-child(2){
    align-self: center;
} */
    .box div{
        /* width: 200px; */
        /* height: 100px; */
        background-color: aquamarine;
    }
    .box div:nth-child(1){
        width: 200px;
    }
    .box div:nth-child(2){
        flex:1;
        /* 将盒子一剩余的部分，分为一份，给2 */
    }
    .box div :nth-child(3){
        flex: 2;
        /* 将盒子一剩余分为2+1，给三2 */
    }
</style>
</head>
<body>
    <div class="box">
    <div>  1 </div>
<div>2</div>
<div>3</div>
    </div>
</body>
</html>
