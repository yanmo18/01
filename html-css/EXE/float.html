<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动-产品布局</title>
    <style>
*{
    margin: 0;
    padding: 0;
}
li{
    list-style: none;
}
.product {
    margin: 50px auto;
    width: 1226px;
    height: 628px;
    background-color: aquamarine;

}
.left {
    float: left;
    width: 234px;
    height: 628px;
    background-color: rgb(82, 214, 95);
}
.right {
    float: right;
    width: 978px;
    height: 628px;
    background-color:rgb(132, 89, 232);
}
.right li{
    float: left;
    width: 234px;
    height: 300px;
    background-color: rgb(39, 90, 244);
margin-right: 14px;
margin-bottom: 14px;
}
.right li:nth-child(4n){
    margin-right: 0;
}
    </style>
</head>
<body>
<!-- 版心：左右，右边：8个li -->
    <div class="product">
        <div class="left"> </div>
        <div class="right"> 
            <ul>
            <li></li>
               <li></li>
                  <li></li>
                     <li></li>
                     <li></li>
               <li></li>
                  <li></li>
                     <li></li>
                     </ul>
        </div>
    </div>
</body>
</html>
